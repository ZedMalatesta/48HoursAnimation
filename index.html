<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>See It. Report It.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Courier+Prime:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app" class="poster">
    <header class="masthead">
      <span class="masthead__title">Unified Civic Authority</span>
      <span class="masthead__bureau">Bureau of Social Standing</span>
    </header>

    <section class="hero" aria-labelledby="slogan">
      <h1 class="slogan" id="slogan">
        <span class="slogan__see">See it.</span>
        <span class="slogan__report">Report it.</span>
      </h1>
      <div class="hero__eye">
        <div class="rays" aria-hidden="true"></div>
        <svg class="eye" id="poster-eye" role="img" aria-label="The all-seeing eye of the Civic Authority"></svg>
      </div>
    </section>
  </main>
</body>
</html>
